[package]
name = "domain_tools"
version = "0.4.0"
description = "Desktop DNS, WHOIS, subdomain, website stack, and domain health toolkit"
authors = ["NRS"]
edition = "2021"

[lib]
name = "domain_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "domain_tools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
hickory-resolver = { version = "0.25.2", features = ["tokio", "system-config", "dnssec-ring", "tls-ring", "https-ring", "webpki-roots"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["gzip", "brotli", "deflate"] }
regex = "1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
x509-parser = "0.16"
sha2 = "0.10"
